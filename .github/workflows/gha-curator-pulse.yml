name: 📚 Curator Pulse (enrich + score)

# Curator re-parses and re-scores artifacts whose upstream content changed, and
# assigns categories. It never adds rows — only Scout does that.
# Follows the structure of gha-scout-pulse.yml. Contract: specs/SPEC-enrich.md

on:
  schedule:
    - cron: "23 3 * * *" # daily, 03:23 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max artifacts to enrich this run"
        required: false
        default: "500"
        type: string
      force:
        description: "Re-score even when content_hash is unchanged"
        required: false
        default: false
        type: boolean

concurrency:
  group: gha-curator-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Curator legitimately has nothing to do when no artifact changed, so unlike
  # Scout there is no minimum-accepted floor here. A zero-work run is healthy.
  ENRICH_ERROR_FAIL_THRESHOLD: "10"

jobs:
  curate:
    name: Enrich and score changed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      CURATE_API_URL: ${{ vars.CURATE_API_URL || 'https://skills-hub.pages.dev/api/cron/curate' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LIMIT: ${{ inputs.limit || '500' }}
      FORCE: ${{ inputs.force }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }

      - run: npm ci

      - name: Preflight
        run: |
          if [ -z "$PROXY_SECRET" ]; then
            echo "::error::PROXY_SECRET is not set. See docs/RUNBOOK-CLOUDFLARE.md step 5."
            exit 1
          fi

      - name: 📚 Run Curator
        run: |
          set -o pipefail
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o curate-report.json \
            -X POST "$CURATE_API_URL" \
            -H "Authorization: Bearer $PROXY_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"limit\": $LIMIT, \"force\": ${FORCE:-false}}")

          echo "HTTP $HTTP_CODE"
          cat curate-report.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Curate endpoint returned $HTTP_CODE"
            exit 1
          fi

      - name: Evaluate outcome
        run: |
          SCORED=$(jq -r '.scored // 0' curate-report.json)
          SKIPPED=$(jq -r '.skipped // 0' curate-report.json)
          ERRORS=$(jq -r '.errors | length' curate-report.json)

          {
            echo "### 📚 Curator Pulse"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Scored | $SCORED |"
            echo "| Skipped (unchanged) | $SKIPPED |"
            echo "| Errors | $ERRORS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt "$ENRICH_ERROR_FAIL_THRESHOLD" ]; then
            echo "::error::$ERRORS enrich errors, over threshold $ENRICH_ERROR_FAIL_THRESHOLD."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curator-evidence-${{ github.run_id }}
          path: curate-report.json
          retention-days: 14
          if-no-files-found: warn
