name: CI Guardrail

# Runs on every push and PR. This is the gate the Definition of Done refers to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true # TODO: flip to false once P1–P2 land

      - name: Build
        run: npm run build
        continue-on-error: true # TODO: flip to false once the web module lands

      - name: Secret scan
        run: |
          # Cheap guard against the mistake that is expensive to undo. Looks for
          # a real-looking secret assigned in tracked files, not the word
          # "secret" itself (which appears legitimately throughout the docs).
          if git grep -nIE '(PROXY_SECRET|CRON_SECRET|CLOUDFLARE_API_TOKEN)[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9_-]{16,}' -- . ':!*.md'; then
            echo "::error::A literal secret value appears to be committed."
            exit 1
          fi
          echo "No committed secret values found."

  migration-check:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }

      - run: npm ci

      - name: Apply migrations to a scratch local D1
        working-directory: apps/web
        run: npx wrangler d1 migrations apply DB --local --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: "" # --local needs no credentials

      - name: Assert schema shape
        working-directory: apps/web
        run: |
          # Catches a migration that parses but forgot a table, and the FTS
          # triggers, which are easy to break and silent when broken.
          npx wrangler d1 execute DB --local --config wrangler.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" \
            --json > schema.json
          cat schema.json

          for table in artifacts sources source_runs artifact_checks categories run_locks clicks artifacts_fts; do
            if ! grep -q "\"$table\"" schema.json; then
              echo "::error::Expected table '$table' is missing after migration."
              exit 1
            fi
          done
          echo "All expected tables present."
