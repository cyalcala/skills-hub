name: ✂️ Pruner Pulse (deactivate)

# Pruner is the ONLY agent that sets is_active = 0. It acts on evidence Sentinel
# already recorded rather than checking anything itself, so a network blip
# cannot cascade into mass deactivation.
#
# It NEVER deletes. Every deactivation carries an inactive_reason, and a
# resurrected artifact can be reactivated by Scout on its next sighting.
# Contract: specs/SPEC-verify.md

on:
  schedule:
    - cron: "13 4 * * 1" # weekly, Monday 04:13 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be deactivated without writing"
        required: false
        default: true
        type: boolean

concurrency:
  group: gha-pruner-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A prune run that would deactivate more than this share of the live corpus
  # is almost certainly a bug, not a mass extinction. Refuse and page a human.
  MAX_PRUNE_RATIO_PCT: "10"

jobs:
  prune:
    name: Deactivate dead and stale artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      PRUNE_API_URL: ${{ vars.PRUNE_API_URL || 'https://aiskills-hub.pages.dev/api/cron/prune' }}
      # Default TRUE on manual dispatch; the schedule below overrides to false.
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }

      - run: npm ci

      - name: Preflight
        run: |
          if [ -z "$PROXY_SECRET" ]; then
            echo "::error::PROXY_SECRET is not set. See docs/RUNBOOK-CLOUDFLARE.md step 5."
            exit 1
          fi

      - name: ✂️ Run Pruner
        run: |
          set -o pipefail
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o prune-report.json \
            -X POST "$PRUNE_API_URL" \
            -H "Authorization: Bearer $PROXY_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\": ${DRY_RUN:-true}, \"maxRatioPct\": $MAX_PRUNE_RATIO_PCT}")

          echo "HTTP $HTTP_CODE"
          cat prune-report.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Prune endpoint returned $HTTP_CODE"
            exit 1
          fi

      - name: Evaluate outcome
        run: |
          CANDIDATES=$(jq -r '.candidates // 0' prune-report.json)
          DEACTIVATED=$(jq -r '.deactivated // 0' prune-report.json)
          BLOCKED=$(jq -r '.blockedBySafetyRatio // false' prune-report.json)

          {
            echo "### ✂️ Pruner Pulse"
            echo ""
            echo "- Dry run: \`${DRY_RUN}\`"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Candidates | $CANDIDATES |"
            echo "| Deactivated | $DEACTIVATED |"
            echo ""
            echo "#### Reasons"
            jq -r '.byReason // {} | to_entries[] | "- `\(.key)`: \(.value)"' prune-report.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BLOCKED" = "true" ]; then
            echo "::error::Prune refused: candidate set exceeded ${MAX_PRUNE_RATIO_PCT}% of the live corpus. Investigate before forcing."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruner-evidence-${{ github.run_id }}
          path: prune-report.json
          retention-days: 30
          if-no-files-found: warn
