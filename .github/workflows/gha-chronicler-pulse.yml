name: 📜 Chronicler Pulse (evidence rollup)

# Chronicler publishes the operational evidence: it reads source health and run
# history and commits docs/source-health-latest.md.
#
# This is the ONLY workflow with `contents: write`. Everything else is
# read-only, so a compromised adapter cannot rewrite the repository.
# Contract: specs/SPEC-pulse.md

on:
  schedule:
    - cron: "51 7 * * 1" # weekly, Monday 07:51 UTC
  workflow_dispatch:

concurrency:
  group: gha-chronicler-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chronicle:
    name: Publish source health rollup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      HEALTH_API_URL: ${{ vars.HEALTH_API_URL || 'https://skills-hub.pages.dev/api/cron/health-rollup' }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Preflight
        run: |
          if [ -z "$PROXY_SECRET" ]; then
            echo "::error::PROXY_SECRET is not set. See docs/RUNBOOK-CLOUDFLARE.md step 5."
            exit 1
          fi

      - name: 📜 Fetch rollup
        run: |
          set -o pipefail
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o rollup.json \
            -X POST "$HEALTH_API_URL" \
            -H "Authorization: Bearer $PROXY_SECRET" \
            -H "Content-Type: application/json")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health rollup endpoint returned $HTTP_CODE"
            exit 1
          fi

      - name: Render markdown
        run: |
          mkdir -p docs
          {
            echo "# Source Health — latest"
            echo ""
            echo "Generated by Chronicler on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "from workflow run [\`${GITHUB_RUN_ID}\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo ""
            echo "This file is generated. Do not edit it by hand — Chronicler overwrites it weekly."
            echo ""
            echo "## Corpus"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Active artifacts | $(jq -r '.corpus.active // 0' rollup.json) |"
            echo "| Inactive artifacts | $(jq -r '.corpus.inactive // 0' rollup.json) |"
            echo "| Categories | $(jq -r '.corpus.categories // 0' rollup.json) |"
            echo "| Median quality score | $(jq -r '.corpus.medianScore // 0' rollup.json) |"
            echo ""
            echo "## Sources"
            echo ""
            echo "| Adapter | Locator | Health | Consecutive failures | Last run |"
            echo "|---|---|---|---:|---|"
            jq -r '.sources[]? | "| `\(.adapter)` | \(.locator) | \(.health) | \(.consecutive_failures) | \(.last_run_at // "never") |"' rollup.json
            echo ""
            echo "## Recent runs"
            echo ""
            echo "| Agent | Started | Status | Discovered | Accepted | Rejected |"
            echo "|---|---|---|---:|---:|---:|"
            jq -r '.recentRuns[]? | "| \(.agent) | \(.started_at) | \(.status) | \(.discovered) | \(.accepted) | \(.rejected) |"' rollup.json
          } > docs/source-health-latest.md

          cat docs/source-health-latest.md

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs/source-health-latest.md; then
            echo "No change in source health. Nothing to commit."
            exit 0
          fi

          git add docs/source-health-latest.md
          git commit -m "chore(chronicler): refresh source health rollup [skip ci]"
          git push
